<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Shopping trolley coming toward you (front view) -->
  
  <!-- Handle bar (top, horizontal) -->
  <rect x="10" y="10" width="80" height="6" fill="#888" stroke="#555" stroke-width="1" rx="2"/>
  
  <!-- Handle grips -->
  <rect x="8" y="8" width="12" height="10" fill="#666" stroke="#444" stroke-width="1" rx="2"/>
  <rect x="80" y="8" width="12" height="10" fill="#666" stroke="#444" stroke-width="1" rx="2"/>
  
  <!-- Vertical handle posts -->
  <rect x="18" y="16" width="4" height="20" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="78" y="16" width="4" height="20" fill="#888" stroke="#555" stroke-width="1"/>
  
  <!-- Cart basket (wider at top, tapered) -->
  <path d="M 15,35 L 10,80 L 25,80 L 25,35 Z" fill="#C0C0C0" stroke="#666" stroke-width="2"/>
  <path d="M 85,35 L 90,80 L 75,80 L 75,35 Z" fill="#C0C0C0" stroke="#666" stroke-width="2"/>
  <rect x="25" y="35" width="50" height="45" fill="#C0C0C0" stroke="#666" stroke-width="2"/>
  
  <!-- Basket grid (vertical lines) -->
  <line x1="35" y1="35" x2="32" y2="80" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="35" x2="50" y2="80" stroke="#999" stroke-width="1"/>
  <line x1="65" y1="35" x2="68" y2="80" stroke="#999" stroke-width="1"/>
  
  <!-- Basket grid (horizontal lines) -->
  <line x1="10" y1="45" x2="90" y2="45" stroke="#999" stroke-width="1"/>
  <line x1="12" y1="55" x2="88" y2="55" stroke="#999" stroke-width="1"/>
  <line x1="14" y1="65" x2="86" y2="65" stroke="#999" stroke-width="1"/>
  
  <!-- Support legs -->
  <rect x="20" y="80" width="6" height="25" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="74" y="80" width="6" height="25" fill="#888" stroke="#555" stroke-width="1"/>
  
  <!-- Wheels (front view - circles) -->
  <circle cx="23" cy="108" r="10" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="77" cy="108" r="10" fill="#333" stroke="#000" stroke-width="2"/>
  
  <!-- Wheel hubs -->
  <circle cx="23" cy="108" r="5" fill="#666"/>
  <circle cx="77" cy="108" r="5" fill="#666"/>
  
  <!-- Wheel spokes -->
  <line x1="23" y1="103" x2="23" y2="113" stroke="#888" stroke-width="1"/>
  <line x1="18" y1="108" x2="28" y2="108" stroke="#888" stroke-width="1"/>
  <line x1="77" y1="103" x2="77" y2="113" stroke="#888" stroke-width="1"/>
  <line x1="72" y1="108" x2="82" y2="108" stroke="#888" stroke-width="1"/>
  
  <!-- Cart logo/brand circle -->
  <circle cx="50" cy="55" r="10" fill="#A0A0A0" stroke="#666" stroke-width="1" opacity="0.5"/>
  <text x="50" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">$</text>
</svg>

