<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fish swimming toward camera (front view) -->
  
  <!-- Body (wide, compressed from front) -->
  <ellipse cx="50" cy="50" rx="35" ry="28" fill="#FF6347" stroke="#CC3333" stroke-width="2"/>
  
  <!-- Belly (lighter) -->
  <ellipse cx="50" cy="58" rx="25" ry="18" fill="#FFA07A" opacity="0.6"/>
  
  <!-- Side fins (spread out) -->
  <ellipse cx="20" cy="55" rx="12" ry="20" fill="#FF8C69" stroke="#CC3333" stroke-width="1.5" 
           transform="rotate(-25 20 55)"/>
  <ellipse cx="80" cy="55" rx="12" ry="20" fill="#FF8C69" stroke="#CC3333" stroke-width="1.5" 
           transform="rotate(25 80 55)"/>
  
  <!-- Dorsal fin (top, visible) -->
  <path d="M 42,22 L 50,12 L 58,22 Q 50,26 42,22 Z" 
        fill="#FF8C69" stroke="#CC3333" stroke-width="1.5"/>
  
  <!-- Bottom fin -->
  <path d="M 42,78 L 50,88 L 58,78 Q 50,74 42,78 Z" 
        fill="#FF8C69" stroke="#CC3333" stroke-width="1.5"/>
  
  <!-- Face markings/scales -->
  <path d="M 35,42 Q 40,44 35,46" stroke="#CC3333" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 65,42 Q 60,44 65,46" stroke="#CC3333" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 44,38 Q 50,40 56,38" stroke="#CC3333" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Eyes (both visible, wide set) -->
  <circle cx="38" cy="42" r="6" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  <circle cx="62" cy="42" r="6" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  <circle cx="39" cy="42" r="3" fill="#000000"/>
  <circle cx="63" cy="42" r="3" fill="#000000"/>
  <circle cx="40" cy="41" r="1.5" fill="#FFFFFF"/>
  <circle cx="64" cy="41" r="1.5" fill="#FFFFFF"/>
  
  <!-- Mouth (forward-facing) -->
  <ellipse cx="50" cy="60" rx="8" ry="5" fill="#CC3333" opacity="0.7"/>
  <path d="M 44,60 Q 50,63 56,60" stroke="#992222" stroke-width="1.5" fill="none"/>
  
  <!-- Gill slits (both sides visible) -->
  <path d="M 28,50 Q 26,54 28,58" stroke="#CC3333" stroke-width="1.5" fill="none"/>
  <path d="M 72,50 Q 74,54 72,58" stroke="#CC3333" stroke-width="1.5" fill="none"/>
  
  <!-- Body stripes/detail -->
  <path d="M 30,48 Q 50,50 70,48" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M 30,62 Q 50,64 70,62" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>

