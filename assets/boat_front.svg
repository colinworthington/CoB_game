<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Boat coming toward you (front view) -->
  
  <!-- Hull (wide, V-shaped from front) -->
  <path d="M 30,50 L 20,75 L 100,75 L 90,50 Z" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Hull inner detail -->
  <path d="M 35,52 L 28,70 L 92,70 L 85,52 Z" fill="#A0522D" stroke="#654321" stroke-width="1"/>
  
  <!-- Bow wave/waterline -->
  <path d="M 20,75 Q 15,78 10,75 Q 20,78 30,75" fill="#B0E0E6" opacity="0.5"/>
  <path d="M 100,75 Q 105,78 110,75 Q 100,78 90,75" fill="#B0E0E6" opacity="0.5"/>
  
  <!-- Cabin/structure -->
  <rect x="45" y="30" width="30" height="22" fill="#FFFFFF" stroke="#999" stroke-width="2" rx="2"/>
  
  <!-- Cabin windows -->
  <rect x="50" y="35" width="8" height="8" fill="#87CEEB" stroke="#666" stroke-width="1" rx="1"/>
  <rect x="62" y="35" width="8" height="8" fill="#87CEEB" stroke="#666" stroke-width="1" rx="1"/>
  
  <!-- Cabin roof -->
  <path d="M 42,30 L 60,20 L 78,30 Z" fill="#CC0000" stroke="#990000" stroke-width="1.5"/>
  
  <!-- Windshield -->
  <rect x="48" y="25" width="24" height="5" fill="#B0E0E6" stroke="#666" stroke-width="1" opacity="0.7"/>
  
  <!-- Railings (both sides visible) -->
  <line x1="30" y1="50" x2="30" y2="58" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="90" y1="50" x2="90" y2="58" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="28" y1="50" x2="32" y2="50" stroke="#C0C0C0" stroke-width="1.5"/>
  <line x1="88" y1="50" x2="92" y2="50" stroke="#C0C0C0" stroke-width="1.5"/>
  
  <!-- Mast/antenna -->
  <line x1="60" y1="20" x2="60" y2="8" stroke="#888" stroke-width="2"/>
  <circle cx="60" cy="6" r="3" fill="#FF0000"/>
  
  <!-- Hull reflection in water -->
  <ellipse cx="60" cy="76" rx="35" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Deck details -->
  <circle cx="40" cy="60" r="3" fill="#FFD700" stroke="#CC9900" stroke-width="1"/>
  <circle cx="80" cy="60" r="3" fill="#FFD700" stroke="#CC9900" stroke-width="1"/>
</svg>

