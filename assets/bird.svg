<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Seagull/Bird -->
  
  <!-- Body -->
  <ellipse cx="50" cy="50" rx="25" ry="18" fill="#E8E8E8" stroke="#999" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="65" cy="40" r="12" fill="#FFFFFF" stroke="#999" stroke-width="2"/>
  
  <!-- Beak -->
  <polygon points="75,40 85,42 75,44" fill="#FFA500" stroke="#CC7000" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="70" cy="38" r="2" fill="#000000"/>
  
  <!-- Left Wing (up position) -->
  <path d="M 30,50 Q 10,30 15,25 Q 20,28 25,35 Q 28,42 30,50" fill="#D3D3D3" stroke="#999" stroke-width="2"/>
  
  <!-- Right Wing (up position) -->
  <path d="M 70,50 Q 90,30 85,25 Q 80,28 75,35 Q 72,42 70,50" fill="#D3D3D3" stroke="#999" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M 30,55 L 20,60 L 25,58 L 30,60 Z" fill="#E8E8E8" stroke="#999" stroke-width="1"/>
  
  <!-- Feet (simple lines) -->
  <line x1="45" y1="65" x2="45" y2="72" stroke="#FFA500" stroke-width="2"/>
  <line x1="55" y1="65" x2="55" y2="72" stroke="#FFA500" stroke-width="2"/>
  <path d="M 42,72 L 45,72 L 48,72" stroke="#FFA500" stroke-width="1.5" fill="none"/>
  <path d="M 52,72 L 55,72 L 58,72" stroke="#FFA500" stroke-width="1.5" fill="none"/>
</svg>

