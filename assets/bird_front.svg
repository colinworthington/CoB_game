<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Seagull flying toward camera (front view) -->
  
  <!-- Wings spread wide (left wing) -->
  <path d="M 10,50 Q 5,35 15,30 Q 25,33 35,40 Q 40,45 45,50 L 35,55 Q 25,52 15,50 Z" 
        fill="#E8E8E8" stroke="#999" stroke-width="2"/>
  
  <!-- Wings spread wide (right wing) -->
  <path d="M 110,50 Q 115,35 105,30 Q 95,33 85,40 Q 80,45 75,50 L 85,55 Q 95,52 105,50 Z" 
        fill="#E8E8E8" stroke="#999" stroke-width="2"/>
  
  <!-- Wing feather details -->
  <path d="M 20,40 L 18,50" stroke="#AAA" stroke-width="1" opacity="0.6"/>
  <path d="M 30,38 L 28,50" stroke="#AAA" stroke-width="1" opacity="0.6"/>
  <path d="M 100,40 L 102,50" stroke="#AAA" stroke-width="1" opacity="0.6"/>
  <path d="M 90,38 L 92,50" stroke="#AAA" stroke-width="1" opacity="0.6"/>
  
  <!-- Body (viewed from front) -->
  <ellipse cx="60" cy="55" rx="18" ry="25" fill="#FFFFFF" stroke="#999" stroke-width="2"/>
  
  <!-- Chest/belly -->
  <ellipse cx="60" cy="62" rx="12" ry="18" fill="#F5F5F5" opacity="0.8"/>
  
  <!-- Head -->
  <circle cx="60" cy="35" r="14" fill="#FFFFFF" stroke="#999" stroke-width="2"/>
  
  <!-- Eyes (both visible from front) -->
  <ellipse cx="54" cy="33" rx="3" ry="4" fill="#000000"/>
  <ellipse cx="66" cy="33" rx="3" ry="4" fill="#000000"/>
  <circle cx="54" cy="32" r="1" fill="#FFFFFF"/>
  <circle cx="66" cy="32" r="1" fill="#FFFFFF"/>
  
  <!-- Beak (pointed toward viewer) -->
  <path d="M 60,42 L 58,48 L 60,47 L 62,48 Z" fill="#FFA500" stroke="#CC7000" stroke-width="1"/>
  
  <!-- Feet hanging down -->
  <line x1="54" y1="78" x2="54" y2="85" stroke="#FFA500" stroke-width="2"/>
  <line x1="66" y1="78" x2="66" y2="85" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Talons -->
  <path d="M 51,85 L 54,85 L 57,85" stroke="#FFA500" stroke-width="1.5" fill="none"/>
  <path d="M 63,85 L 66,85 L 69,85" stroke="#FFA500" stroke-width="1.5" fill="none"/>
  
  <!-- Tail feathers (bottom, small from front) -->
  <path d="M 54,78 Q 60,83 66,78" stroke="#999" stroke-width="2" fill="none"/>
</svg>

