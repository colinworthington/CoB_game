<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <!-- Orange/Red Fish -->
  
  <!-- Body -->
  <ellipse cx="55" cy="30" rx="30" ry="18" fill="#FF6347" stroke="#CC3333" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M 25,30 L 10,20 L 15,30 L 10,40 Z" fill="#FF8C69" stroke="#CC3333" stroke-width="2"/>
  
  <!-- Dorsal Fin (top) -->
  <path d="M 50,12 L 55,5 L 60,12 Z" fill="#FF8C69" stroke="#CC3333" stroke-width="1.5"/>
  
  <!-- Bottom Fin -->
  <path d="M 50,48 L 55,55 L 60,48 Z" fill="#FF8C69" stroke="#CC3333" stroke-width="1.5"/>
  
  <!-- Side Fin (top) -->
  <path d="M 55,20 L 50,15 L 58,18 Z" fill="#FFA07A" stroke="#CC3333" stroke-width="1"/>
  
  <!-- Side Fin (bottom) -->
  <path d="M 55,40 L 50,45 L 58,42 Z" fill="#FFA07A" stroke="#CC3333" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="75" cy="27" r="5" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  <circle cx="76" cy="27" r="2.5" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 85,30 Q 83,32 85,34" stroke="#CC3333" stroke-width="2" fill="none"/>
  
  <!-- Scales (decorative lines) -->
  <path d="M 45,24 Q 50,26 45,28" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 55,22 Q 60,24 55,26" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 55,34 Q 60,36 55,38" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 45,32 Q 50,34 45,36" stroke="#CC3333" stroke-width="0.5" fill="none" opacity="0.5"/>
</svg>

