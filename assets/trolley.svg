<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shopping Trolley -->
  
  <!-- Cart basket -->
  <rect x="20" y="25" width="60" height="45" fill="#C0C0C0" stroke="#666" stroke-width="2" rx="3"/>
  
  <!-- Cart grid pattern -->
  <line x1="30" y1="25" x2="30" y2="70" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="25" x2="40" y2="70" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="25" x2="50" y2="70" stroke="#999" stroke-width="1"/>
  <line x1="60" y1="25" x2="60" y2="70" stroke="#999" stroke-width="1"/>
  <line x1="70" y1="25" x2="70" y2="70" stroke="#999" stroke-width="1"/>
  
  <line x1="20" y1="35" x2="80" y2="35" stroke="#999" stroke-width="1"/>
  <line x1="20" y1="45" x2="80" y2="45" stroke="#999" stroke-width="1"/>
  <line x1="20" y1="55" x2="80" y2="55" stroke="#999" stroke-width="1"/>
  
  <!-- Handle -->
  <rect x="15" y="15" width="4" height="25" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="10" y="10" width="14" height="8" fill="#888" stroke="#555" stroke-width="1" rx="2"/>
  
  <!-- Front wheels -->
  <circle cx="30" cy="80" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="30" cy="80" r="4" fill="#666"/>
  
  <circle cx="70" cy="80" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="70" cy="80" r="4" fill="#666"/>
  
  <!-- Cart legs -->
  <line x1="25" y1="70" x2="30" y2="72" stroke="#888" stroke-width="3"/>
  <line x1="75" y1="70" x2="70" y2="72" stroke="#888" stroke-width="3"/>
  
  <!-- Back wheels (smaller, perspective) -->
  <circle cx="35" cy="77" r="6" fill="#333" stroke="#000" stroke-width="1.5" opacity="0.7"/>
  <circle cx="35" cy="77" r="3" fill="#666" opacity="0.7"/>
  
  <circle cx="65" cy="77" r="6" fill="#333" stroke="#000" stroke-width="1.5" opacity="0.7"/>
  <circle cx="65" cy="77" r="3" fill="#666" opacity="0.7"/>
  
  <!-- Decorative detail - cart logo/brand -->
  <circle cx="50" cy="45" r="8" fill="#A0A0A0" stroke="#666" stroke-width="1" opacity="0.5"/>
</svg>

